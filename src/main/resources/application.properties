spring.application.name=claudecode

# In-memory H2 database (data resets on every restart)
spring.datasource.url=jdbc:h2:mem:appdb

# Browser UI for looking inside the database: http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:appdb, user: sa, empty password)
spring.h2.console.enabled=true
